<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>GOON Bar</title>
        <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="/favicon.ico" sizes="any" />

        <!-- 1st: defines app() globally  (static/ is mounted at URL root, so no /static prefix) -->
        <script src="/app.js"></script>
        <!-- 2nd: Alpine boots on load and evaluates x-data="app()" -->
        <script
            defer
            src="https://unpkg.com/alpinejs@3/dist/cdn.min.js"
        ></script>

        <link rel="stylesheet" href="/style.css" />
    </head>
    <body x-data="app()" x-cloak>
        <!-- decorative botanical sprigs in the side margins (desktop only) -->
        <!--<div class="decor" aria-hidden="true">
            <img class="leaf leaf-l1" src="/leaf.svg" alt="" />
            <img class="leaf leaf-l2" src="/leaf.svg" alt="" />
            <img class="leaf leaf-r1" src="/leaf.svg" alt="" />
            <img class="leaf leaf-r2" src="/leaf.svg" alt="" />
        </div>-->

        <!-- Page banner: wordmark left, waves right -->
        <header>
            <div class="brand">
                <h1 class="wordmark">
                    <img src="/goon_text.svg" alt="GOON" />
                </h1>
            </div>
            <div class="host-bar" x-show="hostMode">
                <span
                    class="host-msg"
                    x-show="refreshMessage"
                    x-text="refreshMessage"
                ></span>
                <button
                    type="button"
                    @click="refreshData()"
                    :disabled="refreshing"
                    x-text="refreshing ? 'Refreshing…' : 'Refresh data'"
                ></button>
            </div>
            <img class="waves" src="/goon-waves.svg" alt="" />
        </header>

        <!-- Category tabs — driven by the `categories` config array -->
        <nav aria-label="Drink categories">
            <template x-for="cat in categories" :key="cat.id">
                <button
                    type="button"
                    @click="selectCategory(cat.id)"
                    :class="{ active: activeCategory === cat.id }"
                    x-text="cat.label"
                ></button>
            </template>
        </nav>

        <!-- Tag filter — floating button (desktop: bottom-left), cocktail tabs only -->
        <div
            class="filter-fab"
            x-data="{ open: false }"
            x-show="['all','mixed-drinks','thc'].includes(activeCategory) && availableTags.length"
            @click.outside="open = false"
        >
            <div class="filter-panel" x-show="open" x-cloak>
                <div class="filter-panel-head">
                    <span>Filter by tag</span>
                    <button
                        type="button"
                        class="filter-clear"
                        x-show="selectedTags.length"
                        @click="selectedTags = []"
                    >
                        Clear
                    </button>
                </div>
                <template x-for="t in availableTags" :key="t.name">
                    <label class="filter-option">
                        <input
                            type="checkbox"
                            :checked="selectedTags.includes(t.name)"
                            @change="toggleTag(t.name)"
                        />
                        <span x-text="t.name"></span>
                    </label>
                </template>
            </div>
            <button
                type="button"
                class="filter-button"
                :class="{ active: selectedTags.length }"
                @click="open = !open"
                :aria-expanded="open"
                aria-label="Filter by tag"
            >
                <span class="filter-icon" aria-hidden="true"></span>
                <span
                    class="filter-count"
                    x-show="selectedTags.length"
                    x-text="selectedTags.length"
                ></span>
            </button>
        </div>

        <!-- Print menu — floating button (bottom-right) opens a category picker -->
        <div
            class="print-fab"
            x-data="{ open: false }"
            @click.outside="open = false"
        >
            <div class="print-panel" x-show="open" x-cloak>
                <div class="print-panel-head"><span>Print menu</span></div>
                <template
                    x-for="cat in categories.filter((c) => c.id !== 'all')"
                    :key="cat.id"
                >
                    <label class="filter-option">
                        <input
                            type="checkbox"
                            :checked="printCategories.includes(cat.id)"
                            @change="togglePrintCategory(cat.id)"
                        />
                        <span x-text="cat.label"></span>
                    </label>
                </template>
                <button
                    type="button"
                    class="print-go"
                    :disabled="!printCategories.length"
                    @click="open = false; printMenu()"
                >
                    Print
                </button>
            </div>
            <button
                type="button"
                class="print-button"
                @click="open = !open"
                :aria-expanded="open"
                aria-label="Print menu"
                title="Print menu"
            >
                <svg
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    aria-hidden="true"
                >
                    <polyline points="6 9 6 2 18 2 18 9" />
                    <path
                        d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"
                    />
                    <rect x="6" y="14" width="12" height="8" />
                </svg>
            </button>
        </div>

        <main>
            <!-- host-only data refresh control -->

            <!-- async status messages (Module 4 per-source status) -->
            <p
                x-show="beverageStatus === 'loading' || cocktailStatus === 'loading'"
            >
                Loading the menu…
            </p>
            <p
                x-show="beverageStatus === 'error' && cocktailStatus === 'error'"
            >
                Sorry — the menu couldn’t load.
            </p>

            <!-- BEVERAGES: one <section> per visible group, cards inside -->
            <template x-for="group in visibleGroups" :key="group.name">
                <section>
                    <h2 x-text="group.name"></h2>

                    <template
                        x-for="product in group.products"
                        :key="product.id"
                    >
                        <article class="beverage">
                            <h3 x-text="product.name"></h3>
                            <p
                                class="description"
                                x-show="product.description"
                                x-text="product.description"
                            ></p>

                            <!-- host-only stock line -->
                            <p
                                class="stock"
                                x-show="hostMode && product.amount !== null"
                                x-text="product.amount + ' ' + product.unit"
                            ></p>

                            <!-- variants (children), e.g. High Noon flavors —
                                 divider only appears when there are variants -->
                            <div
                                class="variants"
                                x-show="product.children.length"
                            >
                                <template
                                    x-for="child in product.children"
                                    :key="child.id"
                                >
                                    <p class="variant">
                                        <span x-text="child.name"></span>
                                        <span
                                            x-show="hostMode"
                                            x-text="'· ' + child.amount + ' ' + child.unit"
                                        ></span>
                                    </p>
                                </template>
                            </div>
                        </article>
                    </template>
                </section>
            </template>

            <!-- COCKTAILS -->
            <template x-for="section in mixedDrinkSections" :key="section.name">
                <section
                    class="cocktail-grid"
                    :class="{ expanded: expandedCocktailIds.length  }"
                >
                    <h2 x-text="section.name"></h2>
                    <template x-for="c in section.drinks" :key="c.id">
                        <article class="cocktail">
                            <div class="card-head">
                                <h3 x-text="c.name"></h3>
                                <div class="tags" x-show="c.tags.length">
                                    <template x-for="t in c.tags" :key="t.name">
                                        <span
                                            class="tag"
                                            :style="tagStyle(t)"
                                            x-text="t.name"
                                        ></span>
                                    </template>
                                </div>
                            </div>
                            <!-- menu-style ingredient prose, shown to everyone (names only, no quantities) -->
                            <p
                                class="ingredients"
                                x-text="ingredientNames(c)"
                            ></p>

                            <!-- prep detail is host-only: guests don't need amounts/method/etc. -->
                            <div
                                class="tags classes"
                                x-show="c.classes.length || (hostMode && !c.available)"
                            >
                                <!-- host-only: far-left flag; prep notes reveal why -->
                                <span
                                    class="tag unavailable"
                                    x-show="hostMode && !c.available"
                                    >Unavailable</span
                                >
                                <template x-for="t in c.classes" :key="t.name">
                                    <span
                                        class="tag"
                                        :style="tagStyle(t)"
                                        x-text="t.name"
                                    ></span>
                                </template>
                            </div>
                            <button
                                type="button"
                                x-show="hostMode"
                                @click="toggleCocktail(c.id)"
                                :aria-expanded="isExpanded(c.id)"
                                x-text="isExpanded(c.id) ? 'Hide prep' : 'Prep details'"
                            ></button>

                            <div
                                class="prep"
                                x-show="hostMode && isExpanded(c.id)"
                            >
                                <!-- ingredient breakdown — aligned columns -->
                                <div class="prep-ingredients">
                                    <template
                                        x-for="ing in c.ingredients"
                                        :key="ing.ingredient"
                                    >
                                        <div class="prep-row">
                                            <span
                                                class="ing-name"
                                                x-text="ing.ingredient"
                                            ></span>
                                            <span
                                                class="ing-amt"
                                                x-text="ing.amount ? ing.amount + ' ' + (ing.unit || '') : ''"
                                            ></span>
                                            <span class="ing-flags">
                                                <span
                                                    class="warn"
                                                    x-show="ing.matched && !ing.in_stock"
                                                    >out of stock</span
                                                >
                                                <span
                                                    class="warn"
                                                    x-show="!ing.matched"
                                                    >unmatched</span
                                                >
                                            </span>
                                        </div>
                                    </template>
                                </div>

                                <p x-show="c.method">
                                    <strong>Method:</strong>
                                    <span x-text="c.method"></span>
                                </p>
                                <p x-show="c.equipment.length">
                                    <strong>Equipment:</strong>
                                    <span
                                        x-text="c.equipment.join(', ')"
                                    ></span>
                                </p>
                                <p x-show="c.host_notes">
                                    <strong>Notes:</strong>
                                    <span x-text="c.host_notes"></span>
                                </p>
                                <p x-show="c.author">
                                    <strong>By:</strong>
                                    <span x-text="c.author"></span>
                                </p>
                                <p
                                    class="warn"
                                    x-show="c.unmatched_ingredients.length"
                                >
                                    ⚠ Unmatched ingredients:
                                    <span
                                        x-text="c.unmatched_ingredients.join(', ')"
                                    ></span>
                                </p>
                            </div>
                        </article>
                    </template>
                </section>
            </template>

            <!-- empty state: ready, but nothing in this category -->
            <p
                x-show="beverageStatus === 'ready' && cocktailStatus === 'ready'
               && visibleGroups.length === 0 && visibleCocktails.length === 0"
            >
                Nothing in this category right now.
            </p>
        </main>

        <footer>
            <a
                href="https://github.com/QuantumBlink1337/beverage-menu"
                target="_blank"
                rel="noopener"
                >GitHub</a
            >
            <span aria-hidden="true">·</span>
            <span>Hosted on Nucleus</span>
        </footer>

        <!-- print-only menu footer: print date + brand bar -->
        <div class="print-footer" aria-hidden="true">
            <p class="print-date" x-text="'Printed ' + printDate()"></p>
            <div class="print-bar"></div>
        </div>
    </body>
</html>
